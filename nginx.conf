server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing – všechny cesty vrátí index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS mají ve jméně hash z buildu (Vite) – při změně obsahu se
    # vygeneruje nový soubor, takže je bezpečné cachovat je natrvalo
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Obrázky ve public/photos mají pevné jméno a mění se i mimo build
    # (přefocení, oprava) – immutable cache by starou verzi držela klidně rok
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Oznámení se mění mimo build (Admin panel commituje přímo do repa) –
    # prohlížeč ho nesmí cachovat, jinak se úprava nepropíše bez tvrdého refreshe
    location = /announcement.json {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
